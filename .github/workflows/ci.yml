name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Free for personal accounts; organisations need a GITLEAKS_LICENSE secret.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_PUBLIC_URL || 'http://localhost:8080' }}
      - name: Dependency audit (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist, retention-days: 7 }

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/test-results, retention-days: 7 }

  security-report:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run security:audit
      - name: Run the 20 security checks (fails the build on any FAIL)
        working-directory: backend
        run: |
          export SESSION_SECRET="$(openssl rand -base64 48)"
          export ENCRYPTION_KEYS="ci1:$(openssl rand -base64 32)"
          export NODE_ENV=development FRONTEND_URL=http://localhost:5173/ API_PUBLIC_URL=http://localhost:8080
          npm run security:report
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: security-report, path: backend/security-reports/security-report.json, retention-days: 30 }

  deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secret-scan, backend, frontend, e2e, security-report]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy (only reached after every gate above passed)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL not set — skipping backend deploy"; exit 0; fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null

  deploy-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secret-scan, backend, frontend, e2e, security-report]
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_PUBLIC_URL || 'https://api.invalid' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
      - uses: actions/deploy-pages@v4
